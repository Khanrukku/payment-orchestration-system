name: Load Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI application
        env:
          DATABASE_URL: sqlite+aiosqlite:///./load_test.db
        run: |
          uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:8000/api/v1/health; then
              echo "API is ready"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 2
          done

          echo "API failed to start"
          cat server.log
          exit 1

      - name: Run Locust load test
        run: |
          mkdir -p load_results

          locust \
            -f load_tests/locustfile.py \
            --headless \
            --host http://127.0.0.1:8000 \
            --users 20 \
            --spawn-rate 5 \
            --run-time 30s \
            --csv load_results/payment_load_test \
            --html load_results/report.html

      - name: Show benchmark summary
        if: always()
        run: |
          echo "===== LOCUST STATS ====="

          if [ -f load_results/payment_load_test_stats.csv ]; then
            cat load_results/payment_load_test_stats.csv
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-load-test-results
          path: load_results/

      - name: Show API logs on failure
        if: failure()
        run: |
          cat server.log || true
